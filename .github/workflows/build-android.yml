name: Build KiriVN Android

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    tags: [ 'v*' ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout KiriVN overlay
        uses: actions/checkout@v4
        with:
          path: kirivn

      - name: Checkout pinned Kirikiroid2Yuri upstream
        uses: actions/checkout@v4
        with:
          repository: YuriSizuku/Kirikiroid2Yuri
          ref: 6e61ce3b81416ceb2be3427a5f0471edefab7151
          path: upstream

      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build tools
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-33" "build-tools;33.0.2" "cmake;3.22.1" "ndk;25.2.9519653"

      - name: Install host tools
        run: sudo apt-get update && sudo apt-get install -y p7zip-full curl

      - name: Fetch upstream prebuilt native dependencies
        working-directory: upstream
        run: |
          curl -L --fail -o thirdparty_build.tar.gz \
            https://github.com/YuriSizuku/Kirikiroid2Yuri/releases/download/deps/thirdparty_build.tar.gz
          curl -L --fail -o thirdparty_port.tar.gz \
            https://github.com/YuriSizuku/Kirikiroid2Yuri/releases/download/deps/thirdparty_port.tar.gz
          tar xzf thirdparty_build.tar.gz
          tar xzf thirdparty_port.tar.gz

      - name: Restore legacy runtime assets required by Yuri source build
        working-directory: upstream
        run: |
          curl -L --fail -o Kirikiroid2_yuri_1.3.9.apk \
            https://github.com/YuriSizuku/Kirikiroid2Yuri/releases/download/1.3.9_yuri/Kirikiroid2_yuri_1.3.9.apk
          7z x -y Kirikiroid2_yuri_1.3.9.apk assets

      - name: Apply KiriVN overlay
        run: python3 kirivn/tools/prepare_upstream.py upstream

      - name: Fetch and verify RuiTomo FVE compatibility profile
        run: |
          mkdir -p upstream/.kirivn
          curl -L --fail -o upstream/.kirivn/ruitomo_fve_xp3filter.tjs \
            'https://raw.githubusercontent.com/zeas2/Kirikiroid2_patch/master/patch/%E6%9A%81WORKS/%E3%82%8B%E3%81%84%E3%81%AF%E6%99%BA%E3%82%92%E5%91%BC%E3%81%B6%20-%E3%83%95%E3%83%AB%E3%83%9C%E3%82%A4%E3%82%B9%E3%82%A8%E3%83%87%E3%82%A3%E3%82%B7%E3%83%A7%E3%83%B3-/xp3filter.tjs'
          python3 kirivn/tools/generate_profiles.py \
            upstream/.kirivn/ruitomo_fve_xp3filter.tjs \
            upstream/src/core/environ/KiriVNGeneratedProfiles.h

      - name: Build debug APK
        working-directory: upstream/project/android
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/25.2.9519653
        run: |
          chmod +x gradlew
          ./gradlew :krkr2yuri:assembleDebug --no-daemon --stacktrace

      - name: Collect APK
        run: |
          mkdir -p dist
          find upstream/build_android -name '*.apk' -type f -print -exec cp {} dist/ \;
          ls -lh dist

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KiriVN-Android
          path: dist/*.apk
          if-no-files-found: error
